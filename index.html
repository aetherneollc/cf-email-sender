<!doctype html><meta name="viewport" content="width=device-width"><title>AetherNeo Mail</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;background:#0b1020;color:#eef}input,textarea{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:10px;background:#121a2d;color:#eef;border:1px solid #345;border-radius:8px}textarea{height:180px}button{padding:11px 18px;background:#5b7cfa;color:white;border:0;border-radius:8px}</style><h1>AetherNeo Mail</h1><p>Cloudflare Email Sending web console</p><form id="f"><label>Password</label><input id="password" type="password" required><button>Sign in</button></form><form id="m" hidden><label>To</label><input id="to" required placeholder="you@example.com"><label>From</label><input id="from" value="noreply@aetherneo.com"><label>Subject</label><input id="subject" required><label>HTML</label><textarea id="html" required></textarea><button>Send email</button></form><pre id="s"></pre><script>const API='https://aetherneo-cf-email.hero-30b.workers.dev';f.onsubmit=async e=>{e.preventDefault();let r=await fetch(API+'/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({password:password.value})});if(r.ok){f.hidden=true;m.hidden=false;s.textContent='Signed in'}else s.textContent='Invalid password'};m.onsubmit=async e=>{e.preventDefault();let r=await fetch(API+'/api/send',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({to:to.value.split(',').map(x=>x.trim()),from:from.value,subject:subject.value,html:html.value})});s.textContent=JSON.stringify(await r.json(),null,2)}</script>
